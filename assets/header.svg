<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Avant-Garde & High-Fashion Typography -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&amp;family=Italiana&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap');

      .title-art {
        font-family: 'Unbounded', 'Italiana', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 58px;
        fill: url(#chromeGradient);
        letter-spacing: 0.26em;
        text-anchor: middle;
        filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.15));
      }
      .subtitle {
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #A1A1AA;
        letter-spacing: 0.46em;
        text-anchor: middle;
        text-transform: uppercase;
      }
      .tagline {
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #52525B;
        letter-spacing: 0.35em;
        text-anchor: middle;
      }
    </style>

    <!-- Deep Luxury Chrome & Obsidian Shading -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1C1C22" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0E0E12" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="chromeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F4F4F5"/>
      <stop offset="70%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <linearGradient id="hairlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272A" stop-opacity="0"/>
      <stop offset="30%" stop-color="#52525B" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#A1A1AA" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#52525B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#27272A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="320" rx="14" fill="url(#ambientGlow)"/>

  <!-- Minimalist Geometric Hairline Frame -->
  <line x1="120" y1="52" x2="1080" y2="52" stroke="url(#hairlineGrad)" stroke-width="1"/>
  <line x1="120" y1="268" x2="1080" y2="268" stroke="url(#hairlineGrad)" stroke-width="1"/>
  
  <!-- Architectural Corner Glyphs -->
  <path d="M 110 44 L 110 60 M 102 52 L 118 52" stroke="#52525B" stroke-width="1"/>
  <path d="M 1090 44 L 1090 60 M 1082 52 L 1098 52" stroke="#52525B" stroke-width="1"/>
  <path d="M 110 260 L 110 276 M 102 268 L 118 268" stroke="#52525B" stroke-width="1"/>
  <path d="M 1090 260 L 1090 276 M 1082 268 L 1098 268" stroke="#52525B" stroke-width="1"/>

  <!-- Top Micro Tag -->
  <text x="600" y="90" class="tagline">/// ENTERPRISE AI AGENTS &amp; FDE ARCHITECTURE</text>

  <!-- Avant-Garde Chrome Title -->
  <text x="600" y="172" class="title-art">ALPHA FDE</text>

  <!-- Editorial Subtitle -->
  <text x="600" y="222" class="subtitle">FORWARD DEPLOYED ENGINEER · AI AGENT ARCHITECT</text>

  <!-- Geometric Modern Indicator -->
  <circle cx="585" cy="248" r="2" fill="#3F3F46"/>
  <circle cx="600" cy="248" r="2.5" fill="#FFFFFF"/>
  <circle cx="615" cy="248" r="2" fill="#3F3F46"/>
</svg>
